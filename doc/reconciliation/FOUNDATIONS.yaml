- id: FND-RESOLVENT
  question: Projector choice and second-order perturbation
  assumptions_to_keep_explicit:
  - Finite self-adjoint H0; ground P for sign theorem; inverse on Ran Q; reduced gap
  consequences_to_check:
  - PVP=0 does not eliminate second order; scalar gap does not evaluate a full operator
    resolvent
