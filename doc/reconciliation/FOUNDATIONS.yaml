- id: FND-GAUSSIAN
  question: Gaussian admissibility and variational meaning
  assumptions_to_keep_explicit:
  - Covariance convention; global CAR positivity; purity/mixedness; physical projection
  consequences_to_check:
  - Pairwise positivity is insufficient for a global Gaussian state; auxiliary variational
    minimum needs a physical comparison contract
