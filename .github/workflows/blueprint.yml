name: Build & Deploy R&D Epistemic Blueprint Portal

on:
  push:
    branches:
      - main
      - develop/m1-foundations-review
    paths:
      - 'PROJECT_STATE.yaml'
      - 'LOG_DISCOVERY_AND_PIVOTS.md'
      - 'doc/rnd/**'
      - 'data/processed/benchmarks/**'
      - 'scripts/build_blueprint.py'
      - '.github/workflows/blueprint.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-blueprint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Build R&D Epistemic Blueprint
        run: python3 scripts/build_blueprint.py --root . --output-dir build/blueprint

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/blueprint

  deploy-blueprint:
    needs: build-blueprint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
