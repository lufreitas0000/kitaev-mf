name: Build & Deploy R&D Epistemic Blueprint Portal

on:
  push:
    branches:
      - main
      - exploration
      - 'research/**'
      - 'promote/**'
      - 'doc/**'
    paths:
      - 'PROJECT_STATE.yaml'
      - 'LOG_DISCOVERY_AND_PIVOTS.md'
      - 'doc/rnd/**'
      - 'data/processed/benchmarks/**'
      - 'scripts/build_blueprint.py'
      - '.github/workflows/blueprint.yml'
  pull_request:
    branches: [main, exploration]
    paths:
      - 'PROJECT_STATE.yaml'
      - 'doc/rnd/**'
      - 'doc/audits/**'
      - 'scripts/build_blueprint.py'
      - '.github/workflows/blueprint.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish reviewed main documents (explicit publication gate)
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && 'pages' || format('{0}-{1}-{2}', github.workflow, github.event_name, github.ref) }}
  cancel-in-progress: false

jobs:
  build-blueprint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Build R&D Epistemic Blueprint
        run: python3 scripts/build_blueprint.py --root . --output-dir build/blueprint

      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/blueprint

  deploy-blueprint:
    needs: build-blueprint
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
