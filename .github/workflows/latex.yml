name: Build LaTeX Living Lab Book & Manuscript

on:
  push:
    branches:
      - main
      - exploration
      - 'research/**'
      - 'promote/**'
      - 'doc/**'
    paths:
      - 'doc/labbook/**'
      - 'doc/manuscript/**'
      - 'doc/shared/**'
      - 'data/processed/benchmarks/**'
      - 'scripts/build_blueprint.py'
      - '.github/workflows/latex.yml'
  pull_request:
    branches: [main, exploration]
    paths:
      - 'doc/labbook/**'
      - 'doc/manuscript/**'
      - 'doc/shared/**'
      - 'data/processed/benchmarks/**'
      - '.github/workflows/latex.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish reviewed main documents (explicit publication gate)
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && 'pages' || format('{0}-{1}-{2}', github.workflow, github.event_name, github.ref) }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile Living Lab Book
        uses: xu-cheng/latex-action@v3
        with:
          root_file: labbook_kitaev_mf.tex
          working_directory: doc/labbook
          extra_system_packages: make
          args: "-pdf -file-line-error -interaction=nonstopmode -halt-on-error"

      - name: Compile SciPost Manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: scipost_kitaev_mf.tex
          working_directory: doc/manuscript
          args: "-pdf -file-line-error -interaction=nonstopmode -halt-on-error"

      - name: Bind publication receipt to compiled PDFs
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path

          sha = os.environ.get('GITHUB_SHA', 'local')
          run_id = os.environ.get('GITHUB_RUN_ID', 'manual')
          receipt = {
              'source_sha': sha,
              'run_id': run_id,
              'artifacts': {}
          }
          for name, rel_path in [
              ('labbook', 'doc/labbook/labbook_kitaev_mf.pdf'),
              ('manuscript', 'doc/manuscript/scipost_kitaev_mf.pdf'),
          ]:
              p = Path(rel_path)
              if p.is_file():
                  data = p.read_bytes()
                  receipt['artifacts'][name] = {
                      'sha256': hashlib.sha256(data).hexdigest(),
                      'bytes': len(data)
                  }
          Path('book-build.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PYCODE

      - name: Upload PDF Artifacts (CI Archive)
        uses: actions/upload-artifact@v4
        with:
          name: kitaev-mf-documents
          path: |
            doc/labbook/labbook_kitaev_mf.pdf
            doc/manuscript/scipost_kitaev_mf.pdf
            book-build.json
          if-no-files-found: error

      - name: Publish Direct PDF to Latest Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp doc/labbook/labbook_kitaev_mf.pdf kitaev-mf-labbook.pdf
          cp doc/manuscript/scipost_kitaev_mf.pdf kitaev-mf-manuscript.pdf

          if gh release view latest >/dev/null 2>&1; then
            echo "Updating existing release..."
            gh release upload latest kitaev-mf-labbook.pdf kitaev-mf-manuscript.pdf book-build.json --clobber
          else
            echo "Creating initial release..."
            gh release create latest kitaev-mf-labbook.pdf kitaev-mf-manuscript.pdf book-build.json \
              --title "kitaev-mf Documents (Latest Build)" \
              --notes "Automated build of Living Lab Book and SciPost Manuscript from main. book-build.json provides SHA-256 provenance receipts."
          fi

      - name: Build GitHub Pages Portal with Compiled PDFs
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        run: |
          python3 -m pip install pyyaml --break-system-packages || pip install pyyaml
          python3 scripts/build_blueprint.py --root . --output-dir build/blueprint
          cp book-build.json build/blueprint/book-build.json

      - name: Upload GitHub Pages Artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/blueprint

  deploy_pages:
    needs: build_latex
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Compiled PDFs & Blueprint to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
