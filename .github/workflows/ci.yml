name: CI Suite

# Research branches are validated locally. Run hosted CI only when proposing
# changes for integration into main.
on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Code formatting and linting (ruff)
        run: |
          ruff check .

      - name: Type checking (mypy)
        run: |
          mypy src test

      - name: Run unit test suite
        run: |
          pytest --cov=src --cov-report=term-missing
