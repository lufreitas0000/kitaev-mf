name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  verify:
    name: Lockfile, Lint, Typecheck, Tests & Provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pip-tools and dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pip-tools
          pip-sync requirements.txt requirements-dev.txt
          pip install -e . --no-deps

      - name: Verify lockfiles are in sync with .in specifications
        run: |
          pip-compile --resolver=backtracking --quiet -o requirements.txt requirements.in
          pip-compile --resolver=backtracking --quiet -o requirements-dev.txt requirements-dev.in
          git diff --exit-code requirements.txt requirements-dev.txt

      - name: Run Ruff linter and format check
        run: |
          ruff check src test scripts
          ruff format --check src test scripts

      - name: Run Mypy strict static type checking
        run: |
          mypy src test scripts

      - name: Run Pytest suite with coverage
        run: |
          pytest --cov=kitaev_mf --cov-report=term-missing test/

      - name: Verify reconciliation catalog and external data provenance
        run: |
          python -B doc/reconciliation/check_index.py
          python -B scripts/sync_external_data.py --verify
