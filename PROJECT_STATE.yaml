milestone_history:
  - id: M1.1
    name: Local Majorana algebra, representation, physical projection, and exact quartic Hamiltonian
    status: completed
    acceptance: Verified A01-A20 contracts across 25 unit tests on Clifford CAR algebra, Casimir identities, physical projection, and exact quartic exchange.
    evidence:
      - doc/rnd/phase_1/m1_1_t1_local_majorana_algebra_conventions.md
      - doc/rnd/phase_1/m1_1_t2_spin_gauge_representation.md
      - doc/rnd/phase_1/m1_1_t3_physical_projection_pauli_algebra.md
      - doc/rnd/phase_1/m1_1_t4_exchange_tensor_quartic_hamiltonian.md
      - doc/rnd/phase_1/m1_1_t5_test_specification_and_validation.md
      - test/unit/test_local_majorana_algebra.py
      - test/unit/test_local_majorana_representations.py
      - test/unit/test_physical_projection.py
      - test/unit/test_exchange_hamiltonian.py
    validation: user_reported_local_wsl_pass
  - id: M1.2
    name: Generalized decoupling and momentum-space Bloch matrices
    status: completed
    acceptance: Verified exact pure-Kitaev dispersion, flat gauge bands, and 2-site to 4-site supercell folding unitary equivalence.
    evidence:
      - doc/rnd/phase_1/m1_2_t1_majorana_mean_field_decoupling.md
      - doc/rnd/phase_1/m1_2_t2_bloch_momentum_and_folding_parity.md
      - test/unit/test_hamiltonian.py
    validation: user_reported_local_wsl_pass
  - id: M1.3
    name: Project-state synchronization, correlator integration, and DIIS solver
    status: completed
    acceptance: Verified zero-temperature spectral projector, BZ integration to real-space covariances, Joint Anderson Acceleration, and K-006 high-precision quadrature benchmark.
    evidence:
      - doc/rnd/phase_1/m1_3_t1_spectral_projector_and_diis_solver.md
      - doc/rnd/phase_1/m1_3_t2_k006_quadrature_provenance.md
      - src/kitaev_mf/services/quadrature.py
      - scripts/k006_quadrature.py
      - test/unit/test_correlators.py
      - test/unit/test_solver.py
      - test/unit/test_k006_quadrature.py
    validation: user_reported_local_wsl_pass
  - id: M1.4
    name: Production observables, plaquette Wilson loops, and variational energetics services
    status: completed
    acceptance: Verified local magnetization, bond spin correlators, plaquette Wilson loops, extensive and density energetics, scalar double-counting subtraction, and end-to-end convergence.
    evidence:
      - doc/rnd/phase_1/m1_4_t1_observables_and_energetics_theory.md
      - doc/rnd/phase_1/m1_4_t2_observable_test_specification.md
      - doc/rnd/phase_1/m1_4_t3_energetics_test_specification.md
      - doc/rnd/phase_1/m1_4_t4_energy_normalization_audit.md
      - doc/rnd/phase_1/m1_4_t5_integration_audit_and_anomalies.md
      - src/kitaev_mf/domain/lattice.py
      - src/kitaev_mf/domain/state.py
      - src/kitaev_mf/services/observables.py
      - src/kitaev_mf/services/energetics.py
      - test/unit/test_production_observables.py
      - test/unit/test_production_energetics.py
      - test/integration/test_m1_system_convergence.py
    validation: user_reported_local_wsl_pass
  - id: M1.4.5
    name: Consolidated verification across advanced kinematic sum rules, semidefinite constraints, solvable limits, and dualities
    status: completed
    acceptance: Verified TST-KIN-01..03, TST-SDP-01..03, TST-RED-01..03, TST-SYM-01..03, TST-ASY-01, TST-VAR-01..02, TST-DUA-01 across 103 unit and integration tests with reproducible .dat benchmark exports.
    evidence:
      - doc/rnd/phase_1/m1_4_5_t1_kinematic_and_semidefinite_invariants.md
      - doc/rnd/phase_1/m1_4_5_t2_kkt_stationarity_and_response_asymptotics.md
      - doc/rnd/phase_1/m1_4_5_t3_quasifree_manifolds_and_stability.md
      - test/unit/test_kinematic_and_semidefinite.py
      - test/unit/test_solvable_limits.py
      - test/unit/test_symmetry_selection_rules.py
      - test/integration/test_variational_response.py
      - test/integration/test_dualities_and_asymptotics.py
      - test/unit/test_hardware_parity.py
      - data/processed/benchmarks/k006_quadrature.dat
      - data/processed/benchmarks/hellmann_feynman_scaling.dat
      - data/processed/benchmarks/susceptibility_curve.dat
      - data/processed/benchmarks/klein_duality_splitting.dat
    validation: user_reported_local_wsl_pass

