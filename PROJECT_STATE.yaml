active_milestone:
  id: "M1.4.5"
  description: "Consolidated verification and invariant hardening"
  objective: "Add independent tests for kinematic identities, Gaussian-state representability, solvable limits, symmetry selection rules, variational response, and canonical dualities."
  status: "active"
  sprint_goal: "Establish a layered, convention-consistent verification gate for the production mean-field services and record CPU/CUDA parity evidence."
  specification: "doc/rnd/note_04f_advanced_invariants_and_sum_rules_backlog.md"
  active_tasks:
    - id: "T1"
      title: "Kinematic and semidefinite gates"
      status: "planned"
      target_files:
        - "test/unit/test_kinematic_and_semidefinite.py (planned)"
        - "src/kitaev_mf/services/hamiltonian.py (existing; contract inspection)"
        - "src/kitaev_mf/services/correlators.py (existing; contract inspection)"
      contracts:
        - "TST-KIN-01: Parseval-Frobenius second spectral moment; establish finite-grid orthogonality and non-aliasing conditions."
        - "TST-KIN-02: Pointwise commutation [H(k), P(k)] = 0."
        - "TST-KIN-03: P(k)^2 = 2P(k), trace/filling, and reflection sum rule P(-k) + P(k)^T = 2I."
        - "TST-SDP-01: Hermiticity and positive semidefiniteness of the local two-site correlation matrix."
        - "TST-SDP-02: Spectral-norm bounds on bond correlators and singular-value bounds on on-site covariance blocks."
        - "TST-SDP-03: Bloch-ball magnetization and local parity/Pfaffian bounds."
      validation:
        - "python -m pytest test/unit/test_kinematic_and_semidefinite.py -q"
    - id: "T2"
      title: "Solvable limits, symmetry selection rules, and asymptotics"
      status: "planned"
      target_files:
        - "test/unit/test_solvable_limits.py (planned)"
        - "test/unit/test_symmetry_selection_rules.py (planned)"
        - "src/kitaev_mf/services/correlators.py (existing; contract inspection)"
        - "src/kitaev_mf/services/observables.py (existing; contract inspection)"
      contracts:
        - "TST-RED-01: Decoupled zigzag-chain limit K_z = 0 with U_bar = 4/(3*pi), under the note's stated coupling and cell conventions."
        - "TST-RED-02: Exact isolated-dimer point K_x = K_y = 0; verify flat bands and correlator/energy normalization."
        - "TST-SYM-01: Time-reversal-odd mixed correlators vanish at zero field and D = 0."
        - "TST-SYM-02: Sublattice inversion relations, conditional on inversion-symmetric geometry, uniform fields, and a symmetry-preserving state."
        - "TST-SYM-03: C3-related bond observables agree on the isotropic line."
        - "TST-ASY-01: High-field polarization trend; test a controlled sequence in |h|/|K| rather than treating one finite ratio as an asymptotic limit."
      validation:
        - "python -m pytest test/unit/test_solvable_limits.py test/unit/test_symmetry_selection_rules.py -q"
    - id: "T3"
      title: "Variational response and canonical dualities"
      status: "planned"
      target_files:
        - "test/integration/test_variational_response.py (planned)"
        - "test/integration/test_dualities_and_asymptotics.py (planned)"
        - "src/kitaev_mf/services/energetics.py (existing; contract inspection)"
        - "src/kitaev_mf/services/solver.py (existing; contract inspection)"
      contracts:
        - "TST-VAR-01: Numerical Hellmann-Feynman derivative dE/dh^gamma = -sum_s V_s^(0 gamma), with differentiability and stationarity assumptions stated."
        - "TST-VAR-02: Non-negative susceptibility only for the globally minimized equilibrium energy envelope, or a separately justified stable branch; do not impose it on arbitrary stationary/metastable solutions."
        - "TST-RED-03: Bipartite sign-inversion energy duality at zero field, after matching cell and coupling conventions."
        - "TST-DUA-01: Four-sublattice Klein duality in the four-site cell, including the full parameter map and zero-field restriction."
      validation:
        - "python -m pytest test/integration/test_variational_response.py test/integration/test_dualities_and_asymptotics.py -q"
    - id: "T4"
      title: "CPU/CUDA parity and final M1 verification gate"
      status: "planned"
      target_files:
        - "test/integration/test_backend_parity.py (planned)"
        - "scripts/check_import_cycles.py (planned)"
        - "Makefile (existing; register the import-architecture check in verify)"
      contracts:
        - "TST-HW-01: Backend parity for selected deterministic observables and solver outputs within precision- and conditioning-justified tolerances."
        - "TST-ARCH-01: Detect prohibited import cycles or dependency-direction violations; define the checker scope explicitly."
        - "TST-GATE-01: Full repository verification passes on CPU; CUDA parity is run only when CUDA is available and is reported separately."
      validation:
        - "make verify"
        - "python scripts/check_import_cycles.py"
        - "python -m pytest test/integration/test_backend_parity.py -q"
        - "python -c 'import torch; assert torch.cuda.is_available()' (CUDA preflight; run CUDA parity only if it passes)"

hardware_targets:
  local:
    cpu: "Intel Core i5-13500 (14 cores, 20 threads)"
    ram: "64 GB DDR5"
    gpu: "NVIDIA GeForce RTX 3050 6GB VRAM (WSL2)"
  cloud:
    target: "Google Colab Pro (NVIDIA L4 22.5GB, 53GB System RAM)"

verified_physics_invariants:
  - id: "K-001"
    name: "Clifford CAR algebra generators"
    equation: "{c_i^mu, c_j^nu} = 2 * delta_ij * delta_munu * I"
    status: "verified_analytical_and_pytest"
    provenance:
      analytical: "doc/rnd/note_00a_local_majorana_algebra_and_conventions.md"
      test: "test/unit/test_local_majorana_algebra.py::test_t00a_01_majorana_car"
  - id: "K-002"
    name: "Gauge Casimir vs Parity"
    equation: "T_i^2 = (3/8) * (I - D_i)"
    status: "verified_analytical_and_pytest"
    provenance:
      analytical: "doc/rnd/note_00b_local_spin_gauge_representation.md"
      test: "test/unit/test_local_majorana_representations.py::test_t00b_03_spin_and_gauge_casimirs_equal_parity_expressions"
  - id: "K-003"
    name: "SO(4) Lie algebra commutation relations"
    equation: "[G^a, G^b] = -2*eps_{abc}*G^c and [M^a, M^b] = 2*eps_{abc}*M^c and [M^a, G^b] = 0"
    status: "verified_analytical_and_pytest"
    provenance:
      analytical: "doc/rnd/note_00a_local_majorana_algebra_and_conventions.md"
      tests:
        - "test/unit/test_local_majorana_algebra.py::test_t00a_05_gauge_spin_lie_algebras_and_mutual_commutation"
        - "test/unit/test_local_majorana_representations.py::test_t00b_05_gauge_sign_and_dirac_occupation_parity"
  - id: "K-004"
    name: "Exact Pure Kitaev Analytical Dispersion and Flat Gauge Bands"
    equation: "E_c0(k) = +/- (|K| / 2) * |1 + exp(-i*2pi*k1) + exp(-i*2pi*k2)| and E_cg(k) = +/- (|K| / 2) * |u_matter|"
    status: "verified_analytical_and_pytest"
    provenance:
      analytical: "doc/rnd/note_02_momentum_bloch_formalism.md, Section 4"
      test: "test/unit/test_hamiltonian.py::test_pure_kitaev_analytical_dispersion"
  - id: "K-005"
    name: "Supercell Brillouin-Zone Folding Parity"
    equation: "spec(H_4(q)) = spec(H_2(k_a)) U spec(H_2(k_b))"
    status: "verified_pytest"
    provenance:
      analytical: "doc/rnd/note_02_momentum_bloch_formalism.md, Section 5"
      tests:
        - "test/unit/test_hamiltonian.py::test_brillouin_zone_folding_parity_pure_kitaev"
        - "test/unit/test_hamiltonian.py::test_brillouin_zone_folding_parity_general_couplings"
      numerical_tolerance: 1.0e-14
  - id: "K-006"
    name: "Pure Kitaev thermodynamic-limit matter bond correlator and gauge-link correlator"
    equation: "U_b^00 = -(1/3) integral_BZ |1+exp(-i*2*pi*k1)+exp(-i*2*pi*k2)| approximately -0.5248657458506; U_b^(gamma,gamma) = +1"
    status: "analytical_formula_with_finite_mesh_regression"
    assumptions:
      - "K < 0; J = Gamma = Gamma_prime = D = h = lambda = 0"
      - "Zero-flux gauge background with directed A-to-B gauge link U_b^(gamma,gamma) = +1"
      - "Two-sublattice primitive honeycomb cell and zero-temperature negative-energy matter-band occupation"
      - "Particle-hole-symmetric half occupation for exact zero modes"
    provenance:
      analytical: "doc/rnd/note_03_correlators_saddle_point.md, Section 3"
      dispersion: "doc/rnd/note_02_momentum_bloch_formalism.md, Section 4"
      quadrature: "scripts/k006_quadrature.py"
      regression_test: "test/unit/test_correlators.py::test_pure_kitaev_correlator_invariant_k006"
    numerical_evidence:
      mesh: [36, 36]
      matter_correlator_atol: 0.003
      gauge_correlator_atol: 1.0e-12
      onsite_correlator_and_gauge_residual_atol: 1.0e-14
      decimal_value: "-0.5248657458506"

open_blockers: []
