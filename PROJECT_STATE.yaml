active_milestone:
  id: M1.4.5
  description: Consolidated verification across advanced kinematic sum rules, semidefinite
    constraints, solvable limits, and dualities
  status: in_progress
  sprint_goal: Consolidated verification across advanced kinematic sum rules, semidefinite
    constraints, solvable limits, and dualities
  active_tasks:
  - id: T1
    title: Kinematic and Semidefinite Gates (Tier 1)
    status: completed
    target_files:
    - test/unit/test_kinematic_and_semidefinite.py
    contracts:
    - 'TST-KIN-01: Parseval-Frobenius spectral moment identity'
    - 'TST-KIN-02: Pointwise Bloch Hamiltonian and spectral projector commutation'
    - 'TST-KIN-03: Spectral projector idempotency, trace filling, and reflection sum
      rule'
    - 'TST-SDP-01: Local two-site Majorana LMI positivity'
    - 'TST-SDP-02: Covariance operator norm and singular value bounds'
    - 'TST-SDP-03: Dipole Bloch-ball and fermion parity envelope bounds'
    validation: pytest -v test/unit/test_kinematic_and_semidefinite.py
  - id: T2
    title: Solvable Limits, Symmetries & Asymptotics (Tier 2)
    status: completed
    target_files:
    - test/unit/test_solvable_limits.py
    - test/unit/test_symmetry_selection_rules.py
    contracts:
    - 'TST-RED-01: 1D zigzag chain solvable reduction'
    - 'TST-RED-02: Isolated dimer flat-band saturation'
    - 'TST-SYM-01: Time-reversal-odd correlator vanishing'
    - 'TST-SYM-02: Sublattice inversion parity'
    - 'TST-SYM-03: C3 ray permutation invariance'
    - 'TST-ASY-01: High-field classical energy convergence'
    validation: pytest -v test/unit/test_solvable_limits.py test/unit/test_symmetry_selection_rules.py
  - id: T3
    title: Variational Response & Canonical Dualities (Tier 3)
    status: in_progress
    target_files:
    - test/integration/test_variational_response.py
    - test/integration/test_dualities_and_asymptotics.py
    contracts:
    - 'TST-VAR-01: Variational Hellmann-Feynman magnetization derivative'
    - 'TST-VAR-02: Thermodynamic magnetic concavity and non-negative susceptibility'
    - 'TST-RED-03: Bipartite sign-inversion duality'
    - 'TST-DUA-01: Four-sublattice Klein duality in 4-site cell'
    validation: pytest -v test/integration/test_variational_response.py test/integration/test_dualities_and_asymptotics.py
  - id: T4
    title: Hardware Parity & Verification Gate
    status: planned
    target_files:
    - src/kitaev_mf/infra/linalg_backend.py
    contracts:
    - Full test suite execution on CPU and CUDA through TorchBackend
    - Zero-import-cycle validation
    - 100% pass under make verify
    validation: make verify
hardware_targets:
  local:
    cpu: Intel Core i5-13500 (14 cores, 20 threads)
    ram: 64 GB DDR5
    gpu: NVIDIA GeForce RTX 3050 6GB VRAM (WSL2)
  cloud:
    target: Google Colab Pro (NVIDIA L4 22.5GB, 53GB System RAM)
verified_physics_invariants:
- id: K-001
  name: Clifford CAR algebra generators
  equation: '{c_i^mu, c_j^nu} = 2 * delta_ij * delta_munu * I'
  status: verified_analytical_and_pytest
  provenance:
    analytical: doc/rnd/note_00a_local_majorana_algebra_and_conventions.md
    test: test/unit/test_local_majorana_algebra.py::test_t00a_01_majorana_car
- id: K-002
  name: Gauge Casimir vs Parity
  equation: T_i^2 = (3/8) * (I - D_i)
  status: verified_analytical_and_pytest
  provenance:
    analytical: doc/rnd/note_00b_local_spin_gauge_representation.md
    test: test/unit/test_local_majorana_representations.py::test_t00b_03_spin_and_gauge_casimirs_equal_parity_expressions
- id: K-003
  name: SO(4) Lie algebra commutation relations
  equation: '[G^a, G^b] = -2*eps_{abc}*G^c and [M^a, M^b] = 2*eps_{abc}*M^c and [M^a,
    G^b] = 0'
  status: verified_analytical_and_pytest
  provenance:
    analytical: doc/rnd/note_00a_local_majorana_algebra_and_conventions.md
    tests:
    - test/unit/test_local_majorana_algebra.py::test_t00a_05_gauge_spin_lie_algebras_and_mutual_commutation
    - test/unit/test_local_majorana_representations.py::test_t00b_05_gauge_sign_and_dirac_occupation_parity
- id: K-004
  name: Exact Pure Kitaev Analytical Dispersion and Flat Gauge Bands
  equation: E_c0(k) = +/- (|K| / 2) * |1 + exp(-i*2pi*k1) + exp(-i*2pi*k2)| and E_cg(k)
    = +/- (|K| / 2) * |u_matter|
  status: verified_analytical_and_pytest
  provenance:
    analytical: doc/rnd/note_02_momentum_bloch_formalism.md, Section 4
    test: test/unit/test_hamiltonian.py::test_pure_kitaev_analytical_dispersion
- id: K-005
  name: Supercell Brillouin-Zone Folding Parity
  equation: spec(H_4(q)) = spec(H_2(k_a)) U spec(H_2(k_b))
  status: verified_pytest
  provenance:
    analytical: doc/rnd/note_02_momentum_bloch_formalism.md, Section 5
    tests:
    - test/unit/test_hamiltonian.py::test_brillouin_zone_folding_parity_pure_kitaev
    - test/unit/test_hamiltonian.py::test_brillouin_zone_folding_parity_general_couplings
    numerical_tolerance: 1.0e-14
- id: K-006
  name: Pure Kitaev thermodynamic-limit matter bond correlator and gauge-link correlator
  equation: U_b^00 = -(1/3) integral_BZ |1+exp(-i*2*pi*k1)+exp(-i*2*pi*k2)| = -bar_U
    approx -0.5248657458506; U_b^(gamma,gamma) = +1
  status: analytical_formula_with_finite_mesh_regression
  assumptions:
  - K < 0; J = Gamma = Gamma_prime = D = h = lambda = 0
  - Zero-flux gauge background with directed A-to-B gauge link U_b^(gamma,gamma) =
    +1
  - Two-sublattice primitive honeycomb cell and zero-temperature negative-energy matter-band
    occupation
  - Particle-hole-symmetric half occupation for exact zero modes
  provenance:
    analytical: doc/rnd/note_03_correlators_saddle_point.md, Section 3
    dispersion: doc/rnd/note_02_momentum_bloch_formalism.md, Section 4
    quadrature: scripts/k006_quadrature.py
    regression_test: test/unit/test_correlators.py::test_pure_kitaev_correlator_invariant_k006
  numerical_evidence:
    mesh:
    - 36
    - 36
    matter_correlator_atol: 0.003
    gauge_correlator_atol: 1.0e-12
    onsite_correlator_and_gauge_residual_atol: 1.0e-14
    matter_correlator_u00: '-0.5248657458506'
    form_factor_magnitude_bar_u: '0.5248657458506'
open_blockers: []
