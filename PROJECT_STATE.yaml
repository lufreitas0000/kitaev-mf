active_milestone:
  id: M1.6
  description: Fixed-Point Solver Algorithms and Basin Multistability (2-Site Cell,
    FM Kitaev + [111] Field)
  status: in_progress
  sprint_goal: Implement and benchmark Picard, Joint DIIS, Broyden, and JFNK solvers
    on the Grassmannian manifold under K = -1.0, h || [111]; map basins across QSL,
    polarized, and random seeds.
  active_tasks:
  - id: T1
    title: Grassmannian Solver Implementations (Picard, Broyden, and Newton-Krylov)
    status: in_progress
    target_files:
    - src/kitaev_mf/services/solver.py
    contracts:
    - Contraction factor evaluation mu
    - KKT stationarity epsilon_KKT < 1e-10
    validation: pytest -v test/unit/test_solver.py
  - id: T2
    title: Seed Basin & Multistability Mapping across h/|K| in [0, 1.0]
    status: planned
    target_files:
    - scripts/generate_benchmarks.py
    - data/processed/benchmarks/basin_multistability_111.dat
    contracts:
    - Hysteresis forward/backward continuation
    - Random Grassmannian sampling
    validation: python3 scripts/generate_benchmarks.py --benchmark basins
  - id: T3
    title: Lab Book Synthesis & Figures (Chapter M1.6)
    status: planned
    target_files:
    - doc/labbook/chapters/ch_m1_6_solvers_and_basins.tex
    contracts:
    - Compilation without error under make labbook
    - PGFPlots convergence curves
    validation: make labbook
